version: "3.9"

services:
  db:
    image: postgres:15
    container_name: alarmy_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alarmy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alarmy_pass}
      POSTGRES_DB: ${POSTGRES_DB:-alarmy_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alarmy} -d ${POSTGRES_DB:-alarmy_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: alarmy_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alarmy_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://alarmy:alarmy_pass@db:5432/alarmy_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alarmy_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://alarmy:alarmy_pass@db:5432/alarmy_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-l", "info"]

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alarmy_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://alarmy:alarmy_pass@db:5432/alarmy_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.workers.celery_app", "beat", "-l", "info"]

volumes:
  postgres_data:
